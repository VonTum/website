# The URL the site will be built for
base_url = "https://hirtum.com"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

theme = "tabi"
title = "Lennart's Personal Homepage"

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true
highlight_theme = "css"

[extra]
# Put all your custom variables here

katex = true

menu = [
    { name = "projects", url = "projects", trailing_slash = true },
    { name = "publications", url = "publications", trailing_slash = true },
    { name = "blog", url = "blog", trailing_slash = true },
    { name = "CV", url = "cv.pdf", trailing_slash = false },
]

socials = [
    { name = "github", url = "https://github.com/VonTum/", icon = "github" },
    { name = "youtube", url = "https://www.youtube.com/@LennartVanHirtum", icon = "youtube" },
    { name = "linkedin", url = "https://www.linkedin.com/in/lennart-van-hirtum/", icon = "linkedin"},
    { name = "google-scholar", url = "https://scholar.google.com/citations?hl=en&user=Hnx-7msAAAAJ&view_op=list_works", icon = "google-scholar"}
]

allowed_domains = [
    { directive = "font-src", domains = ["'self'", "data:"] },
    { directive = "img-src", domains = ["'self'", "https://*", "data:"] },
    { directive = "media-src", domains = ["'self'"] },
    { directive = "script-src", domains = ["'self'"] },
    { directive = "style-src", domains = ["'self'"] },
    { directive = "frame-src", domains = ["player.vimeo.com", "https://www.youtube-nocookie.com"] },
]

encode_plaintext_email = true
email = "lennart.vanhirtum@gmail.com"

taxonomies = [{name = "tags", feed = true}]

# favicon = "img/favicon.png"
favicon_emoji = "🦗"
